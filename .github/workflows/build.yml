name: Build Keytag APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Keytag.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Keytag-apk
          path: Keytag.apk

      - name: Publish as a Release (easy download on the phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Keytag build ${{ github.run_number }}
          files: Keytag.apk

      - name: Also save the APK on the "apk" branch (direct download link)
        run: |
          mkdir out && cp Keytag.apk out/ && cd out
          git init -q && git checkout -q -b apk
          git config user.name "keytag-bot"
          git config user.email "keytag-bot@users.noreply.github.com"
          git add Keytag.apk && git commit -qm "APK build ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" apk
